name: Build and Publish Docker Image

permissions:
    contents: read
    packages: write

on:
    push:
        branches:
            - master
    schedule:
        -   cron: 43 2 * * 0
    workflow_dispatch:

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest

        steps:
            -   name: Obtain short commit SHA
                run: |
                    echo "SHORT_SHA=${GITHUB_SHA::12}" >> $GITHUB_ENV

            -   uses: docker/setup-qemu-action@v4
            -   uses: docker/setup-buildx-action@v4
            -   uses: docker/login-action@v4
                with:
                    registry: ghcr.io
                    username: ${{ github.repository_owner }}
                    password: ${{ secrets.GITHUB_TOKEN }}

            -   name: Build and push image to registry
                uses: docker/build-push-action@v7
                with:
                    platforms: linux/amd64,linux/arm64
                    cache-from: type=gha
                    cache-to: type=gha,mode=max
                    push: true
                    tags: |
                        ghcr.io/webfactory/hotfolder:latest
                        ghcr.io/webfactory/hotfolder:sha-${{ env.SHORT_SHA }}
                        ghcr.io/webfactory/hotfolder:sha-${{ env.SHORT_SHA }}-${{ github.run_number }}
                    labels: org.opencontainers.image.source=https://github.com/webfactory/docker-hotfolder
                env:
                    DOCKER_BUILD_SUMMARY: false
                    DOCKER_BUILD_RECORD_UPLOAD: false

            -   name: Delete potentially remaining, untagged container images
                uses: Chizkiyahu/delete-untagged-ghcr-action@v6
                with:
                    token: ${{ secrets.GITHUB_TOKEN }}
                    package_name: hotfolder
                    owner_type: org
                    untagged_only: true

            -   name: Keep only the 10 most recent image versions
                uses: actions/delete-package-versions@v5
                with:
                    package-name: hotfolder
                    package-type: container
                    min-versions-to-keep: 10
                    ignore-versions: ^latest$
